<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nutrifit</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1F6FEB"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#1F6FEB;--gs:#E6EFFE;--bg:#F7F8F7;--tx:#202522;--t2:#727A75;--cd:#fff;--ln:#E4E8E5;--wr:#3B82C4;--rd:#C0463A;--sh:0 1px 3px rgba(32,37,34,.07);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--g:#5B9BFF;--gs:#1B2A44;--bg:#121513;--tx:#ECF0ED;--t2:#9AA39D;--cd:#1B1F1C;--ln:#2A302C;--wr:#6BA8E0;--rd:#E27A6E;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--g:#5B9BFF;--gs:#1B2A44;--bg:#121513;--tx:#ECF0ED;--t2:#9AA39D;--cd:#1B1F1C;--ln:#2A302C;--wr:#6BA8E0;--rd:#E27A6E;--sh:none;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.45rem;margin:0}h2{font-size:1.05rem;margin:22px 0 10px}h3{margin:0 0 4px}
small,.t2{color:var(--t2);font-size:.85rem}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.grow{flex:1;min-width:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.btn{background:var(--g);color:#fff;font-weight:600;padding:12px 16px;border-radius:12px;width:100%}
.btn.s{background:var(--gs);color:var(--g)}.btn.w{width:auto;padding:8px 12px;font-size:.9rem}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib{padding:8px;border-radius:10px;color:var(--t2)}.ib:hover{background:var(--gs);color:var(--g)}
input,select{width:100%;padding:11px 12px;border:1px solid var(--ln);border-radius:12px;background:var(--cd)}
label{display:block;font-size:.85rem;color:var(--t2);margin:10px 0 4px}
.bar{height:8px;background:var(--gs);border-radius:99px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--g);border-radius:99px;transition:width .3s}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--cd);border-top:1px solid var(--ln);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--t2);padding:6px 6px;min-width:50px}
.nav button[aria-current="page"]{color:var(--g);font-weight:600}
.nav .fab{background:var(--g);color:#fff;border-radius:50%;width:52px;height:52px;justify-content:center;margin-top:-18px;min-width:0;padding:0}
.bk{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.item{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--ln)}.item:first-of-type{border-top:0}
.tag{font-size:.7rem;padding:2px 7px;border-radius:99px;background:var(--gs);color:var(--g)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:12px;display:flex;gap:12px;align-items:center;z-index:9;max-width:92vw}
.toast button{color:var(--g);font-weight:700}
.err{color:var(--rd);font-size:.85rem;margin-top:8px}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;border-bottom:1px solid var(--ln);position:relative}
.bars div{flex:1;background:var(--g);border-radius:6px 6px 0 0;min-height:2px}
.lbl{display:flex;gap:8px}.lbl span{flex:1;text-align:center;font-size:.72rem;color:var(--t2)}
.empty{text-align:center;padding:26px 10px;color:var(--t2)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal .wd{font-size:.72rem;color:var(--t2);padding:4px 0}
.cd{min-height:46px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.9rem;border:1px solid transparent;min-width:0}
.cd.nd{color:var(--t2);border:1px dashed var(--ln)}.cd.fu{color:var(--t2);opacity:.55}.cd.td{border-color:var(--g);font-weight:700;color:var(--g)}.cd.sel{background:var(--gs)}.cd.pop{animation:pop .18s ease-out}
.dots{display:flex;gap:4px;height:8px;align-items:center}.dg{width:8px;height:8px;border-radius:50%;background:#2EAD6B}.dr{width:6px;height:6px;border-radius:50%;background:#E5322D}
.cal.l{animation:cl .2s ease-out}.cal.r{animation:cr .2s ease-out}@keyframes cl{from{opacity:.3;transform:translateX(-14px)}}@keyframes cr{from{opacity:.3;transform:translateX(14px)}}@keyframes pop{50%{transform:scale(1.08)}}
</style></head><body>
<main id="app"></main>
<nav class="nav" id="nav" aria-label="Principal"></nav>
<div id="ov"></div><div id="toast"></div>
<script>
const FOODS=[
// n,cat,kcal,p,c,f, d(g/ml)?, u(g por unidad)?, un(nombre unidad)?
["Arroz blanco cocido","Cereales",130,2.7,28,.3],["Arroz blanco crudo","Cereales",360,6.7,80,.6],["Fideos cocidos","Cereales",158,5.8,31,.9],
["Pan lactal (rodaja)","Panificados",265,9,49,3.2,0,25,"rodaja"],["Pan francés","Panificados",270,9,55,3],["Avena","Cereales",380,13,66,7],
["Papa hervida","Verduras",87,1.9,20,.1,0,150,"papa mediana"],["Batata cocida","Verduras",90,2,21,.2],["Pechuga de pollo cocida","Carnes",165,31,0,3.6],
["Carne vacuna magra cocida","Carnes",190,29,0,8],["Huevo entero","Huevos",143,12.6,.7,9.5,0,50,"huevo"],["Atún al natural","Pescados",116,26,0,1],
["Merluza cocida","Pescados",90,19,0,1.3],["Salmón cocido","Pescados",206,22,0,12],["Leche entera","Lácteos",61,3.2,4.8,3.3,1.03],
["Yogur natural entero","Lácteos",61,3.5,4.7,3.3,0,125,"pote"],["Queso cremoso","Lácteos",280,17,2,22],["Manzana","Frutas",52,.3,14,.2,0,180,"manzana"],
["Banana","Frutas",89,1.1,23,.3,0,120,"banana"],["Naranja","Frutas",47,.9,12,.1,0,150,"naranja"],["Tomate","Verduras",18,.9,3.9,.2,0,120,"tomate"],
["Lechuga","Verduras",15,1.4,2.9,.2],["Zanahoria","Verduras",41,.9,10,.2,0,70,"zanahoria"],["Zapallo","Verduras",26,1,6.5,.1],["Brócoli","Verduras",34,2.8,7,.4],
["Palta","Frutas",160,2,8.5,14.7,0,150,"palta"],["Aceite de oliva","Grasas",884,0,0,100,.91],["Manteca","Grasas",717,.9,.1,81],["Azúcar","Azúcares",387,0,100,0],
["Lentejas cocidas","Legumbres",116,9,20,.4],["Garbanzos cocidos","Legumbres",164,8.9,27,2.6],["Almendras","Frutos secos",579,21,22,50],["Maní","Frutos secos",567,26,16,49],
["Dulce de leche","Dulces",315,6,55,7],["Galletitas de agua","Galletitas",430,10,70,12,0,6,"galletita"],["Pizza de muzzarella","Comidas",270,11,33,10,0,110,"porción"],
["Empanada de carne al horno","Comidas",250,10,26,12,0,80,"empanada"],["Gaseosa cola","Bebidas",42,0,10.6,0,1.04],["Tofu","Legumbres",76,8,1.9,4.8]
].map((a,i)=>({id:"b"+i,n:a[0],cat:a[1],k:a[2],p:a[3],c:a[4],f:a[5],d:a[6]||0,u:a[7]||0,un:a[8]||"",src:"Referencia local (valores típicos aproximados)"}));
const MEALS=["Desayuno","Almuerzo","Merienda","Cena","Snacks"];
const ACT=[["Sedentaria",1.2],["Ligeramente activa",1.375],["Moderadamente activa",1.55],["Muy activa",1.725],["Extremadamente activa",1.9]];
const I={home:'<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',plus:'<path d="M12 5v14M5 12h14"/>',chart:'<path d="M3 3v18h18"/><path d="m7 14 4-4 3 3 5-6"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',drop:'<path d="M12 2.7s6 6.3 6 11a6 6 0 0 1-12 0c0-4.7 6-11 6-11z"/>',trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',l:'<path d="m15 18-6-6 6-6"/>',r:'<path d="m9 18 6-6-6-6"/>',copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>',dumb:'<path d="M6 5v14M18 5v14M2 9v6M22 9v6M6 12h12"/>'};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;
let K="nutri-v1";const D0=()=>({profile:null,log:[],water:[],custom:[],weights:[],recent:[],theme:"auto",routines:[],workouts:[],session:null});let S=D0();
try{const r=localStorage.getItem(K);if(r)S={...S,...JSON.parse(r)}}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}if(typeof queue==="function")queue()};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf=(n,d=0)=>Number(n).toLocaleString("es-AR",{maximumFractionDigits:d});
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const shift=(k,n)=>{const[y,m,d]=k.split("-").map(Number);return iso(new Date(y,m-1,d+n))};
const show=k=>k.split("-").reverse().join("/");
const today=()=>iso(new Date());
const norm=s=>String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const num=v=>{const x=parseFloat(String(v).replace(",","."));return isNaN(x)?null:x};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let V={tab:"home",date:today(),sheet:null,onb:!S.profile};
document.documentElement.dataset.theme=S.theme==="auto"?"":S.theme;
if(!S.theme||S.theme==="auto")document.documentElement.removeAttribute("data-theme");
const DB={foods:[],ex:[],err:null,loaded:false};
const allFoods=()=>S.custom.concat(DB.foods.length?DB.foods:FOODS);
const byId=id=>allFoods().find(f=>f.id===id)||FOODS.find(f=>f.id===id);
function tg(p){const t=tg0(p);if(!t)return t;const g=S.goals;return g?{...t,...g}:t}
function tg0(p){if(!p)return null;const bmr=10*p.w+6.25*p.h-5*p.a+(p.sx==="m"?5:p.sx==="f"?-161:-78);let k=bmr*ACT[p.ac][1];
 if(p.a>=18){if(p.go==="lose")k*=.85;if(p.go==="gain")k*=1.1}
 k=Math.round(k/10)*10;const pr=Math.round(1.4*p.w),fa=Math.round(k*.3/9),ca=Math.max(0,Math.round((k-pr*4-fa*9)/4));return{k,p:pr,c:ca,f:fa,w:Math.round(p.w*35/50)*50}}
const dayLog=d=>S.log.filter(e=>e.date===d);
const tot=d=>dayLog(d).reduce((t,e)=>({k:t.k+e.k,p:t.p+e.p,c:t.c+e.c,f:t.f+e.f}),{k:0,p:0,c:0,f:0});
const waterOf=d=>S.water.filter(w=>w.date===d).reduce((a,w)=>a+w.ml,0);
function calc(f,q,u){const g=u==="g"?q:u==="ml"?q*(f.d||1):q*f.u;const r=x=>(x||0)*g/100;return{g,k:r(f.k),p:r(f.p),c:r(f.c),f:r(f.f)}}
function toast(msg,undo){const t=document.getElementById("toast");t.innerHTML=`<div class="toast" role="status"><span>${esc(msg)}</span>${undo?'<button data-a="undo">Deshacer</button>':""}</div>`;window._undo=undo;clearTimeout(window._tt);window._tt=setTimeout(()=>t.innerHTML="",5000)}
function bar(l,v,t,u,col){const pc=t>0?Math.min(100,Math.round(v/t*100)):0;return`<div><div class="row sp"><small>${l}</small><small>${nf(v)}${t?" / "+nf(t):""} ${u}</small></div><div class="bar"><i style="width:${pc}%;${col?"background:"+col:""}"></i></div></div>`}
function ring(v,t){const R=52,C=2*Math.PI*R,pc=t>0?Math.min(1,v/t):0;return`<svg width="130" height="130" viewBox="0 0 130 130" role="img" aria-label="Energía: ${nf(v)} kilocalorías"><circle cx="65" cy="65" r="${R}" fill="none" stroke="var(--gs)" stroke-width="12"/><circle cx="65" cy="65" r="${R}" fill="none" stroke="var(--g)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pc)}" transform="rotate(-90 65 65)"/><text x="65" y="63" text-anchor="middle" font-size="26" font-weight="700" fill="var(--tx)">${nf(v)}</text><text x="65" y="82" text-anchor="middle" font-size="12" fill="var(--t2)">kcal</text></svg>`}
function dateNav(){const t=V.date===today();return`<div class="row sp card" style="padding:6px"><button class="ib" data-a="day" data-n="-1" aria-label="Día anterior">${ic("l")}</button><button data-a="today" style="font-weight:600">${t?"Hoy · ":""}${show(V.date)}</button><button class="ib" data-a="day" data-n="1" aria-label="Día siguiente">${ic("r")}</button></div>`}
function home(){const p=S.profile,T=tg(p),t=tot(V.date),w=waterOf(V.date),n=dayLog(V.date).length;
 return`<div class="row sp"><div><h1>Hola${p.nm?", "+esc(p.nm):""}</h1><small>Tu resumen del día</small></div></div><div style="height:12px"></div>${dateNav()}
 <div class="card row" style="gap:16px">${ring(t.k,T.k)}<div class="grow"><small>Objetivo orientativo</small><div style="font-weight:700;font-size:1.2rem">${nf(T.k)} kcal</div><small>${t.k<=T.k?"Te quedan "+nf(T.k-t.k)+" kcal":"Superaste el objetivo por "+nf(t.k-T.k)+" kcal"}</small></div></div>
 <div class="card">${bar("Proteínas",Math.round(t.p),T.p,"g")}<div style="height:10px"></div>${bar("Carbohidratos",Math.round(t.c),T.c,"g")}<div style="height:10px"></div>${bar("Grasas",Math.round(t.f),T.f,"g")}</div>
 <div class="card"><div class="row sp"><b>${ic("drop")} Agua</b><small>${nf(w)} / ${nf(T.w)} ml</small></div><div class="bar"><i style="width:${Math.min(100,w/T.w*100)}%;background:#38BDF8"></i></div>
 <div class="row" style="margin-top:12px">${[200,250,500].map(m=>`<button class="btn s w grow" data-a="water" data-ml="${m}">+${m} ml</button>`).join("")}<button class="ib" data-a="wundo" aria-label="Quitar último registro de agua">${ic("trash")}</button></div></div>
 ${n?"":`<div class="card empty"><b style="color:var(--tx)">Todavía no registraste nada este día</b><p>Sumá tu primera comida para ver tus totales.</p><button class="btn" data-a="add" data-m="${guess()}">Registrar alimento</button></div>`}
 ${gymCard()}${coachCard()}<h2>Comidas</h2>${MEALS.map(m=>{const es=dayLog(V.date).filter(e=>e.meal===m);return`<div class="card row"><div class="grow"><b>${m}</b><br><small>${es.length?es.length+" elemento"+(es.length>1?"s":"")+" · "+nf(es.reduce((a,e)=>a+e.k,0))+" kcal":"Sin registros"}</small></div><button class="btn s w" data-a="add" data-m="${m}">Añadir</button></div>`}).join("")}`}
function guess(){const h=new Date().getHours();return h<11?"Desayuno":h<15?"Almuerzo":h<19?"Merienda":"Cena"}
function diary(){const T=tg(S.profile);return`<h1>Diario</h1><div style="height:12px"></div>${dateNav()}
 <button class="btn s" data-a="copyprev" style="margin-bottom:12px">${ic("copy")} Copiar el día anterior</button>
 ${MEALS.map(m=>{const es=dayLog(V.date).filter(e=>e.meal===m);return`<div class="card"><div class="row sp"><b>${m}</b><small>${nf(es.reduce((a,e)=>a+e.k,0))} kcal</small></div>
 ${es.length?es.map(e=>`<div class="item"><div class="grow"><div>${esc(e.name)}${e.custom?' <span class="tag">propio</span>':""}</div><small>${nf(e.qty,1)} ${e.unit==="u"?esc(e.food.un||"u."):e.unit} · P ${nf(e.p,1)} · C ${nf(e.c,1)} · G ${nf(e.f,1)}</small></div><b>${nf(e.k)}</b><button class="ib" data-a="edit" data-id="${e.id}" aria-label="Editar cantidad">${ic("edit")}</button><button class="ib" data-a="del" data-id="${e.id}" aria-label="Eliminar">${ic("trash")}</button></div>`).join(""):'<small>Nada registrado todavía.</small>'}
 <button class="btn s" data-a="add" data-m="${m}" style="margin-top:10px">${ic("plus")} Añadir a ${m.toLowerCase()}</button></div>`}).join("")}<small>Valores estimados: pueden variar según marca y preparación.</small>`}
function prog(){const T=tg(S.profile),days=[...Array(7)].map((_,i)=>shift(today(),i-6)),ks=days.map(d=>Math.round(tot(d).k)),logged=days.filter(d=>dayLog(d).length),mx=Math.max(T.k,...ks,1);
 const avg=f=>logged.length?Math.round(logged.reduce((a,d)=>a+tot(d)[f],0)/logged.length):0;
 const freq={};S.log.forEach(e=>freq[e.name]=(freq[e.name]||0)+1);const top=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,5);
 const ws=[...S.weights].sort((a,b)=>b.date<a.date?-1:1).slice(-6);
 return`<h1>Progreso</h1>${calHtml()}<h2>Últimos 7 días (kcal)</h2><div class="card"><div class="bars" role="img" aria-label="Energía por día">${ks.map(k=>`<div style="height:${k/mx*100}%" title="${k} kcal"></div>`).join("")}<span style="position:absolute;left:0;right:0;bottom:${T.k/mx*100}%;border-top:1px dashed var(--t2)"></span></div><div class="lbl">${days.map(d=>`<span>${d.slice(8)}/${d.slice(5,7)}</span>`).join("")}</div></div>
 <div class="grid3"><div class="card"><small>Promedio</small><br><b>${nf(avg("k"))}</b> kcal</div><div class="card"><small>Días con registro</small><br><b>${logged.length}</b> de 7</div><div class="card"><small>Agua prom.</small><br><b>${nf(days.reduce((a,d)=>a+waterOf(d),0)/7)}</b> ml</div></div>
 <div class="card"><small>Promedio diario en días registrados</small><br>Proteínas <b>${avg("p")} g</b> · Carbohidratos <b>${avg("c")} g</b> · Grasas <b>${avg("f")} g</b></div>
 <h2>Más frecuentes</h2><div class="card">${top.length?top.map(t=>`<div class="row sp"><span>${esc(t[0])}</span><small>${t[1]} veces</small></div>`).join(""):'<small>Registrá comidas para ver tus alimentos más usados.</small>'}</div>
 <h2>Peso</h2><div class="card">${ws.length?ws.map(w=>`<div class="row sp"><span>${show(w.date)}</span><b>${nf(w.kg,1)} kg</b></div>`).join(""):'<small>Todavía no cargaste ningún peso.</small>'}
 <div class="row" style="margin-top:12px"><input id="wk" inputmode="decimal" placeholder="Peso en kg, ej. 70,5" aria-label="Peso en kilogramos"><button class="btn w" data-a="addw">Guardar</button></div><div id="werr" class="err"></div></div>`}
function prof(){const p=S.profile,T=tg(p);return`<h1>Perfil</h1><div style="height:12px"></div><div class="card"><b>${esc(p.nm||"Sin nombre")}</b><br><small>${p.a} años · ${nf(p.h)} cm · ${nf(p.w,1)} kg · ${ACT[p.ac][0]}</small>
 <button class="btn s" data-a="editp" style="margin-top:10px">Editar mis datos</button></div>

 if(confirm("Hay datos más nuevos en la nube (otro dispositivo). Aceptar = usar los de la nube (tu versión de este dispositivo queda guardada como copia). Cancelar = reemplazar la nube con los de este dispositivo.")){backup(S);adopt(r);V.onb=!S.profile;render()}else{base=r.updated_at;await push(true)}}
 catch(e){sy("err","No se pudo resolver el conflicto. Reintentá más tarde.")}}
const hasData=d=>!!(d&&(d.profile||(d.log&&d.log.length)||(d.workouts&&d.workouts.length)||(d.weights&&d.weights.length)||(d.custom&&d.custom.length)));
const summ=d=>(d.log||[]).length+" registros de comida, "+(d.workouts||[]).length+" entrenamientos, "+(d.weights||[]).length+" pesos";
async function onUser(u){if(U&&U.id===u.id)return;U=u;K="nutri-u-"+u.id;base=null;V.gate=false;V.load=0;localStorage.removeItem("nutri-mode-local");
 let loc=null;try{loc=JSON.parse(localStorage.getItem(K))}catch(e){}S={...D0(),...(loc||{})};V.onb=false;sy("sync");render();
 try{const r=await pull();
  if(r){if(loc&&localStorage.getItem(dk())){if(confirm("Tenés cambios de este dispositivo sin sincronizar y también hay datos en la nube. Aceptar = usar los de la nube (tus cambios quedan en una copia local). Cancelar = enviar los de este dispositivo.")){backup(loc);adopt(r)}else{base=r.updated_at;await push(true)}}else adopt(r)}
  else{let anon=null;try{anon=JSON.parse(localStorage.getItem("nutri-v1"))}catch(e){}
   if(hasData(loc)){await push()}
   else if(hasData(anon)&&confirm("Encontramos datos guardados en este dispositivo sin cuenta ("+summ(anon)+"). ¿Querés importarlos a tu cuenta? Tus datos locales NO se borran.")){S={...D0(),...anon};try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}await push();const v=await pull();toast(v&&v.data.log.length===S.log.length?"Importación verificada: "+summ(S):"No pudimos verificar la importación. Tus datos locales siguen intactos.")}
   else{S=D0();await push()}}
 }catch(e){sy("err","No se pudo conectar. Trabajás con la copia de este dispositivo y se sincroniza al volver la conexión.")}
 V.onb=!S.profile;render()}
function onOut(){clearTimeout(QT);U=null;base=null;K="nutri-none";S=D0();window._undo=null;document.getElementById("toast").innerHTML="";document.getElementById("ov").innerHTML="";V={tab:"home",date:today(),sheet:null,onb:false,gate:true,load:0};sy("idle");render()}
const em=()=>(document.getElementById("ae")||{value:""}).value.trim(),pw=()=>(document.getElementById("ap")||{value:""}).value;
const aerr=m=>{const e=document.getElementById("aerr");if(e)e.textContent=m};

const AMSG=e=>{const m=String(e&&e.message||"").toLowerCase();return m.includes("invalid login")?"Correo o contraseña incorrectos.":m.includes("not confirmed")?"Confirmá tu correo desde el mensaje que te enviamos.":m.includes("already")?"Ese correo ya tiene una cuenta.":m.includes("password")?"La contraseña debe tener al menos 6 caracteres.":m.includes("rate")?"Demasiados intentos. Esperá un momento.":!navigator.onLine?"Sin conexión.":"No se pudo completar la operación."};

function gateHtml(){return`<div style="padding-top:36px;text-align:center"><h1 style="font-size:2rem;color:var(--g)">Nutrifit</h1><p class="t2">Tu diario de alimentación y entrenamiento. Iniciá sesión para guardar tus datos en la nube y verlos en todos tus dispositivos.</p>${V.load?'<p role="status">Cargando…</p>':V.nolib?'<div class="card err">No se pudo cargar el servicio de cuentas (¿sin conexión?).</div>':`<div class="card" style="text-align:left"><button class="btn" data-a="aglog">Continuar con Google</button><label for="ae">Correo electrónico</label><input id="ae" type="email" autocomplete="email"><label for="ap">Contraseña</label><input id="ap" type="password" autocomplete="current-password"><div id="aerr" class="err" role="alert"></div><div class="row" style="margin-top:12px"><button class="btn s grow" data-a="ain">Ingresar</button><button class="btn s grow" data-a="asignup">Crear cuenta</button></div><button class="t2" style="margin-top:12px;text-decoration:underline" data-a="areset">Olvidé mi contraseña</button></div>`}<button class="t2" style="text-decoration:underline;margin-top:8px" data-a="alocal">Usar sin cuenta (solo en este dispositivo)</button></div>`}
function recovHtml(){return`<div style="padding-top:36px"><h1>Nueva contraseña</h1><div class="card"><label for="np">Elegí una contraseña nueva</label><input id="np" type="password" autocomplete="new-password"><div id="aerr" class="err" role="alert"></div><button class="btn" style="margin-top:12px" data-a="asetpw">Guardar</button></div></div>`}
const shareCard=()=>`<div class="card"><b>Compartir Nutrifit</b><br><small>Se comparte solo el enlace de la app, nunca tus datos. Cada persona usa su propia cuenta.</small><button class="btn s" style="margin-top:10px" data-a="share">Compartir Nutrifit</button></div>`;
function cloudCard(){if(!cfgOK())return`<div class="card"><b>Cuenta y nube</b><br><small>Todavía no está configurada: tus datos se guardan solo en este dispositivo. Seguí el archivo LEEME.md.</small></div>`+shareCard();
 return`<div class="card"><b>Cuenta y nube</b><br>${U?`<small>${esc(U.email||"Sesión iniciada")}</small><div id="sy" role="status" style="margin:8px 0">${esc(SY.msg||"")}</div><div class="row"><button class="btn s w grow" data-a="sync">Sincronizar ahora</button><button class="btn s w grow" data-a="asignout">Cerrar sesión</button></div>`:`<small>Estás usando la app sin cuenta: tus datos quedan solo en este dispositivo.</small><button class="btn s" style="margin-top:10px" data-a="alogin">Iniciar sesión o crear cuenta</button>`}</div>`+shareCard()}
function goalsCard(){const p=S.profile,T=tg(p),g=S.goals;return`<div class="card"><b>Mis objetivos nutricionales</b><br><small>${g?"Usando tus valores manuales.":"Usando el cálculo orientativo automático."} Son estimaciones, no prescripciones médicas${p.a<18?"; al ser menor de 18 años conviene definirlos con un profesional de la salud":""}. Cambiarlos no modifica lo que ya registraste.</small><div class="grid3" style="margin-top:6px">${[["k","kcal"],["p","Prot. g"],["c","Carb. g"],["f","Grasas g"],["w","Agua ml"]].map(x=>`<div><label for="go-${x[0]}">${x[1]}</label><input id="go-${x[0]}" inputmode="decimal" value="${T[x[0]]}"></div>`).join("")}</div><div id="goerr" class="err" role="alert"></div><div class="row" style="margin-top:10px"><button class="btn w grow" data-a="gosave">Guardar</button><button class="btn s w grow" data-a="goreset">Volver al automático</button></div></div>`}
Object.assign(acts,{
 async aglog(){busy(1);const{error}=await SB.auth.signInWithOAuth({provider:"google",options:{redirectTo:CFG.APP_URL}});if(error){busy(0);aerr("No se pudo iniciar con Google. Verificá que el proveedor esté habilitado.")}},
 async ain(){if(badMail())return;if(!pw())return aerr("Ingresá tu contraseña.");busy(1);const{error}=await SB.auth.signInWithPassword({email:em(),password:pw()});busy(0);if(error)aerr(AMSG(error))},
 async asignup(){if(badMail())return;if(pw().length<6)return aerr("La contraseña debe tener al menos 6 caracteres.");busy(1);const{data,error}=await SB.auth.signUp({email:em(),password:pw(),options:{emailRedirectTo:CFG.APP_URL}});busy(0);if(error)aerr(AMSG(error));else if(!data.session)aerr("Te enviamos un correo para confirmar tu cuenta. Después ingresá.")},
 async areset(){if(badMail())return;busy(1);const{error}=await SB.auth.resetPasswordForEmail(em(),{redirectTo:CFG.APP_URL});busy(0);aerr(error?AMSG(error):"Si el correo existe, te enviamos un enlace para restablecer la contraseña.")},
 async asetpw(){const v=document.getElementById("np").value;if(v.length<6)return aerr("Mínimo 6 caracteres.");busy(1);const{error}=await SB.auth.updateUser({password:v});busy(0);if(error)aerr(AMSG(error));else{V.recov=false;render();toast("Contraseña actualizada")}},
 alocal(){localStorage.setItem("nutri-mode-local","1");K="nutri-v1";try{S={...D0(),...JSON.parse(localStorage.getItem(K))}}catch(e){S=D0()}V.gate=false;V.load=0;V.onb=!S.profile;render()},
 alogin(){K="nutri-none";S=D0();localStorage.removeItem("nutri-mode-local");V={tab:"home",date:today(),sheet:null,onb:false,gate:true,load:0};render()},
 async asignout(){await flush();if(localStorage.getItem(dk())&&!confirm("Hay cambios sin sincronizar que quedan solo en este dispositivo. ¿Cerrar sesión igual?"))return;await SB.auth.signOut()},
 async sync(){if(U){queue();await flush()}},
 gosave(){const g={},er=document.getElementById("goerr");for(const[k,mx]of[["k",10000],["p",1000],["c",1500],["f",1000],["w",10000]]){const v=num(document.getElementById("go-"+k).value);if(v==null||v<=0||v>mx)return er.textContent="Revisá los valores: deben ser números mayores a 0 y razonables.";g[k]=Math.round(v)}S.goals=g;save();render();toast("Objetivos guardados")},
 goreset(){delete S.goals;save();render();toast("Volviste al cálculo automático")},
 async share(){const url=cfgOK()&&!CFG.APP_URL.includes("TU-")?CFG.APP_URL:location.href.split("#")[0];try{if(navigator.share){await navigator.share({title:"Nutrifit",text:"Probá Nutrifit, mi app de nutrición y entrenamiento.",url});return}}catch(e){if(e&&e.name==="AbortError")return}try{await navigator.clipboard.writeText(url);toast("Enlace copiado")}catch(e){toast("Copiá este enlace: "+url)}}});
document.addEventListener("visibilitychange",async()=>{if(document.visibilityState==="visible"&&U&&!PB&&!localStorage.getItem(dk())){try{const r=await pull();if(r&&r.updated_at!==base){adopt(r);V.onb=!S.profile;render()}}catch(e){}}});
function boot(){const local=localStorage.getItem("nutri-mode-local")==="1";
 if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
 if(!cfgOK()){render();return}
 if(!local){K="nutri-none";S=D0();V.onb=false;V.gate=true;V.load=1}
 if(!window.supabase){V.nolib=1;V.load=0;render();return}
 SB=supabase.createClient(CFG.URL,CFG.KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 SB.auth.onAuthStateChange((ev,ses)=>{setTimeout(()=>{if(ev==="PASSWORD_RECOVERY"){V.recov=true;V.load=0;render();return}
  if(ses&&ses.user)onUser(ses.user);else if(ev==="SIGNED_OUT")onOut();else if(ev==="INITIAL_SESSION"&&V.gate){V.load=0;render()}},0)});
 addEventListener("online",queue);render()}
loadDB();boot();
